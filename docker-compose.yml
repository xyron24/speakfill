name: speakfill

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./infra/caddy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      DOMAIN: ${DOMAIN:-}
    depends_on:
      - web
      - api
    restart: unless-stopped

  web:
    build: ./apps/web
    expose:
      - "3000"
    restart: unless-stopped

  api:
    build: ./apps/api
    expose:
      - "8000"
    environment:
      APP_NAME: ${APP_NAME:-speakfill}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      DATA_DIR: /data
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://speakfill:speakfill@db:5432/speakfill}
      SMALLEST_API_KEY: ${SMALLEST_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - appdata:/data
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-speakfill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-speakfill}
      POSTGRES_DB: ${POSTGRES_DB:-speakfill}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
  caddy_data:
